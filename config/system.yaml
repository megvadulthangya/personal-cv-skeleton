home:
  alias: '/left'

# --- ÚJ RÉSZ: Többnyelvűség beállítása ---
languages:
  supported:
    - en
    - hu
  default_lang: en        # Az Angol az alapértelmezett (Profi!)
  include_default_lang: false # Az angol URL tiszta marad (pl. domain.com/), nem lesz domain.com/en/
  translations: true      # Fordítások engedélyezése
  http_accept_language: true # IP/Böngésző nyelv alapján dönt (hu -> hu, minden más -> en)
  override_locale: true
  session_store_active: true # Megjegyzi, ha a látogató nyelvet váltott
# -----------------------------------------

pages:
  theme: resume-nordic
  process:
    markdown: true
    twig: false
  markdown:
    extra: true

cache:
  enabled: false   # Fejlesztés alatt jó a false, élesben majd állítsd true-ra!
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: true
  auto_reload: true
  autoescape: false

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: false
  js_minify: true

debugger:
  enabled: false
  twig: true
  shutdown:
    close_connection: true
